name: "Device compatibility report"
description: "Confirm or investigate another LAICA/YoHealth scale model."
title: "[DEVICE] "
labels: ["device-compatibility", "validation"]
body:
  - type: input
    id: model
    attributes:
      label: Exact scale model
      placeholder: "LAICA PS7200L"
    validations:
      required: true
  - type: input
    id: ble_name
    attributes:
      label: BLE local name
      placeholder: "YoHealth"
    validations:
      required: false
  - type: textarea
    id: frames
    attributes:
      label: Manufacturer data / advertising samples
      render: text
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include status transitions, weight, impedance and any differences from docs/PROTOCOL.md.
    validations:
      required: true
  - type: textarea
    id: app_compare
    attributes:
      label: Companion-app comparison
      description: If available, compare body-composition values with this integration.
    validations:
      required: false
