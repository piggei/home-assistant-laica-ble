name: "Measurement validation"
description: "Compare one real weighing with LAICA BLE/Home Assistant output."
title: "[MEASUREMENT] "
labels: ["measurement", "validation"]
body:
  - type: markdown
    attributes:
      value: |
        Please submit one weighing per issue. Do not publish your name or exact date of birth; age in whole years is enough for validation.
  - type: input
    id: model
    attributes:
      label: Scale model
      placeholder: "LAICA PS7002"
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Companion app and version
    validations:
      required: false
  - type: input
    id: age
    attributes:
      label: Age used by the app (whole years)
    validations:
      required: false
  - type: dropdown
    id: sex
    attributes:
      label: Sex branch selected in the app profile
      options: [Male, Female, Not disclosed]
    validations:
      required: true
  - type: input
    id: height
    attributes:
      label: Height (cm)
    validations:
      required: false
  - type: textarea
    id: app_values
    attributes:
      label: Values shown by the companion app
      placeholder: |
        Weight: ... kg
        BMI: ...
        Body fat: ... %
        Water: ... %
        Muscle: ... %
        Bone mass: ... / not displayed
        Visceral fat: ... / not displayed
        Body age: ... / not displayed
        BMR: ... kcal/day
    validations:
      required: true
  - type: textarea
    id: ha_values
    attributes:
      label: Values calculated by LAICA BLE / Home Assistant
    validations:
      required: true
  - type: input
    id: impedance
    attributes:
      label: Impedance / health raw (if available)
    validations:
      required: false
  - type: input
    id: frame
    attributes:
      label: Final manufacturer frame (if available)
      placeholder: "02 A1 09 FF ... 86 ... AA"
    validations:
      required: false
