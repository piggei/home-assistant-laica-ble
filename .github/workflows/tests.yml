name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test tools
        run: python -m pip install --upgrade pytest ruff

      - name: Ruff
        run: ruff check custom_components tests tools

      - name: Pytest
        run: pytest -q

      - name: Legacy self-test
        run: python tools/selftest.py

      - name: Compile Python
        run: python -m compileall -q custom_components tests tools

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'OK {path}')
          PY
